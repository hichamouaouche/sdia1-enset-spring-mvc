<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout1">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>

</head>
<body>
<div class="p-3" layout:fragment="content1">
    <form th:action="@{/admin/saveProduct}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${product.name}">
            <span th:errors="${product.name}" class="text-danger" ></span>
        </div>
        <div class="mb-3" >
            <label for="price" class="form-label">price</label>
            <input type="text" class="form-control" id="price" name="price" th:value="${product.price}">
            <span th:errors="${product.price}" class="text-danger" ></span>
        </div>
        <div class="mb-3" >
            <label for="quantity" class="form-label">quantity</label>
            <input type="text" class="form-control" id="quantity" name="quantity" th:value="${product.quantity}">
            <span th:errors="${product.quantity}" class="text-danger" ></span>
        </div>
        <div class="mb-3">
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
</body>
</html>
